services:
  # Backend API Service
  - type: web
    name: candidate-shortlisting-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false

  # Frontend Static Site
  - type: web
    name: candidate-shortlisting-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
